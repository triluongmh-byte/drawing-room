<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f3efe7">
  <title>Drawing Room</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="toolbar" role="toolbar" aria-label="Drawing tools">
    <div class="group">
      <label class="field">Level
        <select id="level" aria-label="Level">
          <option value="0">0 · Warm-up drills</option>
          <option value="1" selected>1 · Trace, guided</option>
          <option value="2">2 · Trace, coach on ask</option>
          <option value="3">3 · From reference</option>
          <option value="4">4 · From reference, review at end</option>
        </select>
      </label>
      <label class="field">Reference
        <select id="reference" aria-label="Reference"></select>
      </label>
      <label class="button upload" title="Upload your own reference image">Upload…
        <input id="upload" type="file" accept="image/*" hidden>
      </label>
    </div>
    <div class="group tools">
      <button data-tool="pencil" class="tool" title="Pencil (P): light sketch lines">✏️ Pencil</button>
      <button data-tool="ink" class="tool" title="Ink (I): final lines">🖋 Ink</button>
      <button data-tool="brush" class="tool" title="Color brush (B)">🖌 Color</button>
      <input id="color" type="color" value="#e0604a" title="Brush color" aria-label="Brush color">
      <button data-tool="eraser" class="tool" title="Eraser (E): removes whole strokes on the active layer">⌫ Eraser</button>
    </div>
    <div class="group">
      <button id="undo" title="Undo (⌘Z)">↶</button>
      <button id="redo" title="Redo (⇧⌘Z)">↷</button>
      <button id="rotate-left" title="Rotate paper left (⇧R)">⟲</button>
      <button id="rotate-right" title="Rotate paper right (R)">⟳</button>
      <button id="fit" title="Fit paper (0)">⤢</button>
      <button id="clear" title="Clear all strokes">Clear</button>
    </div>
  </header>

  <main class="room">
    <section class="paper-wrap" id="paper-wrap">
      <canvas id="paper" aria-label="Drawing paper"></canvas>
      <div class="hint" id="paper-hint">Pen or mouse draws · two fingers / space-drag pan · pinch / wheel zoom</div>
    </section>

    <aside class="side">
      <section class="panel reference-panel">
        <h2>Reference</h2>
        <div class="reference-view" id="reference-view">
          <img id="reference-image" alt="Reference">
          <div class="reference-mark" id="reference-mark" hidden></div>
        </div>
        <label class="slider">Underlay opacity
          <input id="opacity" type="range" min="0" max="1" step="0.05" value="0.35">
        </label>
      </section>

      <section class="panel">
        <h2>Layers</h2>
        <ul class="layers" id="layers"></ul>
      </section>

      <section class="panel guide" id="guide-panel" hidden>
        <h2>Next step</h2>
        <ol class="steps" id="steps"></ol>
        <p id="next-step" class="next-step"></p>
        <button id="next-hint">Show next step</button>
      </section>

      <section class="panel">
        <h2>Score</h2>
        <div class="score" id="score">
          <div><span class="label">Shape</span><span id="score-shape" class="value">–</span></div>
          <div><span class="label">Proportion</span><span id="score-proportion" class="value">–</span></div>
        </div>
        <p id="score-detail" class="detail"></p>
        <div class="row">
          <button id="score-button" class="primary">Score</button>
          <button id="submit-button" class="primary" hidden>Submit</button>
        </div>
      </section>

      <section class="panel coach" id="coach-panel">
        <h2>Coach</h2>
        <textarea id="question" rows="2" placeholder="Ask the coach, e.g. “Why does my circle look flat?”"></textarea>
        <button id="ask-button">Ask coach</button>
        <div id="coach-reply" class="coach-reply" aria-live="polite"></div>
      </section>
    </aside>
  </main>

  <div class="pin-overlay" id="pin-overlay" hidden>
    <form class="pin-box" id="pin-form">
      <h2>Enter the PIN</h2>
      <p>It is printed in the terminal where the server runs.</p>
      <input id="pin-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
      <button class="primary" type="submit">Open</button>
      <p class="error" id="pin-error"></p>
    </form>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
